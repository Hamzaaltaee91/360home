name: dabberli
description: "Reverse Real Estate Platform - دبّرلي"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Supabase
  supabase_flutter: ^1.10.0
  supabase: ^1.10.0

  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Navigation
  go_router: ^10.0.0

  # UI & Design
  flutter_screenutil: ^5.8.0
  google_fonts: ^6.0.0
  cached_network_image: ^3.3.0

  # Utilities
  intl: ^0.20.3
  uuid: ^4.0.0
  dio: ^5.3.0
  image_picker: ^1.0.4
  flutter_image_compress: ^2.1.0
  geolocator: ^10.1.0
  url_launcher: ^6.2.0

  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Local Storage
  shared_preferences: ^2.2.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # Logging
  logger: ^2.0.0

  # Date & Time
  timezone: ^0.9.0

  # Environment
  flutter_dotenv: ^5.1.0

dependency_overrides: {}

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
  generate: true

  # Assets
  # TODO: Uncomment once the asset directories are populated.
  # assets:
  #   - assets/images/
  #   - assets/icons/
  #   - assets/animations/


