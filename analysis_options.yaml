include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # ==== هذه تُوقف الحلقة فوراً (أخطاء حقيقية) ====
    unused_import: error
    duplicate_import: error
    ambiguous_import: error
    undefined_identifier: error
    argument_type_not_assignable: error
    missing_required_argument: error
    invalid_assignment: error
    dead_null_aware_expression: error

    # ==== تحذيرات مفيدة لكن لا تُوقف ====
    deprecated_member_use: warning
    deprecated_member_use_from_same_package: warning

    # ==== ضجيج شكلي: مُطفأ بالكامل ====
    prefer_final_parameters: ignore
    always_put_control_body_on_new_line: ignore
    prefer_expression_function_bodies: ignore
    sort_constructors_first: ignore
    always_put_required_named_parameters_first: ignore
    avoid_redundant_argument_values: ignore
    directives_ordering: ignore
    unnecessary_lambdas: ignore
    avoid_types_on_closure_parameters: ignore
    avoid_positional_boolean_parameters: ignore
    use_raw_strings: ignore
    prefer_const_constructors: ignore
    use_super_parameters: ignore
    sort_pub_dependencies: ignore
    inference_failure_on_function_invocation: ignore
    inference_failure_on_instance_creation: ignore
    inference_failure_on_collection_literal: ignore
    inference_failure_on_function_return_type: ignore
    strict_raw_type: ignore

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "build/**"
    - ".dart_tool/**"

linter:
  rules:
    # القواعد المُبقاة فقط: تمنع أعطالاً حقيقية
    avoid_empty_else: true
    avoid_relative_lib_imports: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    control_flow_in_finally: true
    empty_statements: true
    hash_and_equals: true
    no_duplicate_case_values: true
    prefer_void_to_null: true
    throw_in_finally: true
    unnecessary_statements: true
    unrelated_type_equality_checks: true
    use_build_context_synchronously: true
    valid_regexps: true

# ملاحظة: القواعد التالية كانت في ملفك القديم وهي غير موجودة أو محذوفة،
# وقد أُزيلت نهائياً:
#   invariant_booleans                       (محذوفة في Dart 3.0)
#   avoid_returning_null_for_stream          (غير معروفة)
#   no_leading_underscores_for_local_variables (غير معروفة)
#   prefer_if_null_to_conditional_expressions  (غير معروفة)
#   sized_box_for_spacer                     (غير معروفة)
