<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل العرض — دبّرلي</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="site-nav">
    <div class="container">
      <a href="index.html" class="brand">دبّرلي</a>
      <ul class="nav-links">
        <li><a href="dashboard.html">طلباتي</a></li>
      </ul>
      <div class="nav-actions">
        <button id="signout-btn" class="btn btn-ghost">تسجيل الخروج</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <a href="#" id="back-link" class="btn">→ رجوع</a>
    <p id="loading-msg">جاري التحميل...</p>
    <div id="offer-detail"></div>
    <div id="response-buttons"></div>
    <p class="error-text" id="respond-error" hidden></p>
    <p id="response-status" hidden></p>
    <div id="review-section"></div>
  </div>

  <script type="module">
    import { requireSession, getCurrentAppUserId, signOut } from "./js/auth.js";
    import { getOffer, respondToOffer } from "./js/offers.js";
    import { getMyReviewForOffer, submitReview } from "./js/reviews.js";

    const session = await requireSession();
    document.getElementById("signout-btn").addEventListener("click", signOut);

    const offerId = new URLSearchParams(window.location.search).get("id");
    const loadingMsg = document.getElementById("loading-msg");
    let offer;
    try {
      offer = await getOffer(offerId);
    } finally {
      loadingMsg.hidden = true;
    }

    document.getElementById("back-link").href = `request.html?id=${encodeURIComponent(offer.request_id)}`;

    {
      const detail = document.getElementById("offer-detail");

      if (Array.isArray(offer.photo_urls) && offer.photo_urls.length > 0) {
        const gallery = document.createElement("div");
        gallery.style.display = "flex";
        gallery.style.flexWrap = "wrap";
        gallery.style.gap = "8px";
        gallery.style.marginBottom = "12px";

        offer.photo_urls.forEach((url) => {
          const img = document.createElement("img");
          img.src = url;
          img.alt = offer.property_title ?? "";
          img.style.width = "120px";
          img.style.height = "120px";
          img.style.objectFit = "cover";
          img.style.borderRadius = "8px";
          gallery.appendChild(img);
        });

        detail.appendChild(gallery);
      }

      const card = document.createElement("div");
      card.className = "card";

      const h1 = document.createElement("h1");
      h1.textContent = offer.property_title;

      const pAddress = document.createElement("p");
      pAddress.textContent = offer.property_address;

      const pPrice = document.createElement("p");
      pPrice.textContent = `${offer.offered_price} ${offer.currency}`;

      const pDesc = document.createElement("p");
      pDesc.textContent = offer.property_description ?? "";

      const pMessage = document.createElement("p");
      pMessage.textContent = offer.message_to_buyer ?? "";

      card.append(h1, pAddress, pPrice, pDesc, pMessage);
      detail.appendChild(card);

      const messagesLink = document.createElement("a");
      messagesLink.className = "btn";
      messagesLink.textContent = "الرسائل";
      messagesLink.href = `messages.html?offer_id=${encodeURIComponent(offerId)}`;
      detail.appendChild(messagesLink);
    }

    const buttons = document.getElementById("response-buttons");
    const status = document.getElementById("response-status");

    function renderButtons() {
      buttons.innerHTML = "";
      const interestedBtn = document.createElement("button");
      interestedBtn.className = "btn btn-primary";
      interestedBtn.id = "interested-btn";
      interestedBtn.textContent = "مهتم";
      interestedBtn.addEventListener("click", () => respond("interested"));

      const notInterestedBtn = document.createElement("button");
      notInterestedBtn.className = "btn";
      notInterestedBtn.id = "not-interested-btn";
      notInterestedBtn.textContent = "غير مهتم";
      notInterestedBtn.addEventListener("click", () => respond("not_interested"));

      buttons.append(interestedBtn, notInterestedBtn);
    }

    async function respond(response) {
      const errorEl = document.getElementById("respond-error");
      const interestedBtn = document.getElementById("interested-btn");
      const notInterestedBtn = document.getElementById("not-interested-btn");

      errorEl.hidden = true;
      errorEl.textContent = "";
      interestedBtn.disabled = true;
      notInterestedBtn.disabled = true;

      try {
        await respondToOffer(offerId, response);
      } catch (err) {
        errorEl.textContent = "تعذّر إرسال ردّك، حاول مرة أخرى";
        errorEl.hidden = false;
        interestedBtn.disabled = false;
        notInterestedBtn.disabled = false;
        return;
      }

      status.textContent = response === "interested" ? "تم إرسال اهتمامك" : "تم تسجيل عدم الاهتمام";
      status.hidden = false;
      buttons.innerHTML = "";
    }

    renderButtons();

    if (offer.status === "accepted" && (await getCurrentAppUserId()) !== offer.realtor_id) {
      await renderReviewSection();
    }

    async function renderReviewSection() {
      const section = document.getElementById("review-section");
      const existing = await getMyReviewForOffer(offerId);

      let rating = typeof existing?.rating === "number" ? existing.rating : 0;

      const heading = document.createElement("h2");
      heading.textContent = "قيّم الوسيط";

      const stars = document.createElement("div");
      stars.id = "review-stars";

      const starButtons = [];
      for (let value = 1; value <= 5; value += 1) {
        const star = document.createElement("button");
        star.type = "button";
        star.className = "btn";
        star.textContent = "★";
        star.dataset.value = String(value);
        star.addEventListener("click", () => {
          rating = value;
          paintStars();
        });
        starButtons.push(star);
        stars.appendChild(star);
      }

      function paintStars() {
        starButtons.forEach((star) => {
          star.style.color =
            Number(star.dataset.value) <= rating ? "#f5a623" : "#c0c0c0";
        });
      }
      paintStars();

      const comment = document.createElement("textarea");
      comment.id = "review-comment";
      comment.rows = 3;
      comment.placeholder = "اكتب تعليقك (اختياري)";
      comment.value = existing?.comment ?? "";

      const submitBtn = document.createElement("button");
      submitBtn.type = "button";
      submitBtn.className = "btn btn-primary";
      submitBtn.textContent = "إرسال التقييم";

      const feedback = document.createElement("p");
      feedback.hidden = true;

      submitBtn.addEventListener("click", async () => {
        if (rating < 1) {
          feedback.textContent = "اختر تقييماً من 1 إلى 5";
          feedback.hidden = false;
          return;
        }
        await submitReview(offerId, rating, comment.value);
        feedback.textContent = "تم إرسال تقييمك، شكراً لك";
        feedback.hidden = false;
      });

      section.append(heading, stars, comment, submitBtn, feedback);
    }
  </script>
</body>
</html>
