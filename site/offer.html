<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل العرض — دبّرلي</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <a href="#" id="back-link" class="btn">→ رجوع</a>
    <div id="offer-detail"></div>
    <div id="response-buttons"></div>
    <p id="response-status" hidden></p>
  </div>

  <script type="module">
    import { requireSession } from "./js/auth.js";
    import { getOffer, respondToOffer } from "./js/offers.js";

    await requireSession();

    const offerId = new URLSearchParams(window.location.search).get("id");
    const offer = await getOffer(offerId);

    document.getElementById("back-link").href = `request.html?id=${encodeURIComponent(offer.request_id)}`;

    {
      const detail = document.getElementById("offer-detail");

      if (Array.isArray(offer.photo_urls) && offer.photo_urls.length > 0) {
        const gallery = document.createElement("div");
        gallery.style.display = "flex";
        gallery.style.flexWrap = "wrap";
        gallery.style.gap = "8px";
        gallery.style.marginBottom = "12px";

        offer.photo_urls.forEach((url) => {
          const img = document.createElement("img");
          img.src = url;
          img.alt = offer.property_title ?? "";
          img.style.width = "120px";
          img.style.height = "120px";
          img.style.objectFit = "cover";
          img.style.borderRadius = "8px";
          gallery.appendChild(img);
        });

        detail.appendChild(gallery);
      }

      const card = document.createElement("div");
      card.className = "card";

      const h1 = document.createElement("h1");
      h1.textContent = offer.property_title;

      const pAddress = document.createElement("p");
      pAddress.textContent = offer.property_address;

      const pPrice = document.createElement("p");
      pPrice.textContent = `${offer.offered_price} ${offer.currency}`;

      const pDesc = document.createElement("p");
      pDesc.textContent = offer.property_description ?? "";

      const pMessage = document.createElement("p");
      pMessage.textContent = offer.message_to_buyer ?? "";

      card.append(h1, pAddress, pPrice, pDesc, pMessage);
      detail.appendChild(card);
    }

    const buttons = document.getElementById("response-buttons");
    const status = document.getElementById("response-status");

    function renderButtons() {
      buttons.innerHTML = "";
      const interestedBtn = document.createElement("button");
      interestedBtn.className = "btn btn-primary";
      interestedBtn.id = "interested-btn";
      interestedBtn.textContent = "مهتم";
      interestedBtn.addEventListener("click", () => respond("interested"));

      const notInterestedBtn = document.createElement("button");
      notInterestedBtn.className = "btn";
      notInterestedBtn.id = "not-interested-btn";
      notInterestedBtn.textContent = "غير مهتم";
      notInterestedBtn.addEventListener("click", () => respond("not_interested"));

      buttons.append(interestedBtn, notInterestedBtn);
    }

    async function respond(response) {
      await respondToOffer(offerId, response);
      status.textContent = response === "interested" ? "تم إرسال اهتمامك" : "تم تسجيل عدم الاهتمام";
      status.hidden = false;
      buttons.innerHTML = "";
    }

    renderButtons();
  </script>
</body>
</html>
