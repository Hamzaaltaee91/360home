<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلبات العقارات — دبّرلي</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="site-nav">
    <div class="container">
      <a href="index.html" class="brand">دبّرلي</a>
      <ul class="nav-links">
        <li><a href="admin-realtors.html">توثيق الوسطاء</a></li>
        <li><a href="admin-reports.html">البلاغات</a></li>
        <li><a href="admin-requests.html">طلبات العقارات</a></li>
      </ul>
      <div class="nav-actions">
        <div id="profile-menu-slot"></div>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>طلبات العقارات</h1>
        <p>جميع طلبات العقارات المقدَّمة من المشترين.</p>
      </div>
    </div>

    <p class="error-text" id="page-error" hidden></p>
    <p id="loading-msg">جاري التحميل...</p>

    <ul class="request-list" id="requests-list"></ul>

    <div class="empty-state" hidden id="empty-msg">
      <h3>لا توجد طلبات</h3>
      <p>لم يقدّم أي مشترٍ طلب عقار بعد.</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <a href="index.html" class="brand">دبّرلي</a>
      <ul class="footer-links">
        <li><a href="admin-requests.html">كل الطلبات</a></li>
        <li><a href="contact.html">اتصل بنا</a></li>
      </ul>
      <span>© ٢٠٢٦ دبّرلي</span>
    </div>
  </footer>

  <script type="module">
    import { requireSession, mountProfileMenu } from "./js/auth.js";
    import { supabase } from "./js/supabase-client.js";
    import { updateRequest, deleteRequest } from "./js/requests.js";
    import { formatThousands } from "./js/numerals.js";

    const CATEGORY_LABELS = { residential: "سكني", commercial: "تجاري", land: "أرض" };
    const STATUS_LABELS = { active: "نشط", inactive: "غير نشط", sold: "مباع", rented: "مؤجَّر" };

    await requireSession();
    await mountProfileMenu(document.getElementById("profile-menu-slot"));

    const list = document.getElementById("requests-list");
    const emptyMsg = document.getElementById("empty-msg");
    const loadingMsg = document.getElementById("loading-msg");
    const pageError = document.getElementById("page-error");

    function showPageError(message) {
      pageError.textContent = message;
      pageError.hidden = false;
    }

    function makeTag(text) {
      const li = document.createElement("li");
      li.className = "tag";
      li.textContent = text;
      return li;
    }

    function renderCard(request) {
      const card = document.createElement("li");
      card.className = "card request-item";

      const h3 = document.createElement("h3");
      h3.textContent = request.title ?? "—";
      card.appendChild(h3);

      const buyer = request.users ?? {};
      const tags = document.createElement("ul");
      tags.className = "request-tags";
      tags.appendChild(makeTag(`المشتري: ${buyer.full_name ?? "—"}`));
      tags.appendChild(makeTag(`البريد: ${buyer.email ?? "—"}`));
      tags.appendChild(
        makeTag(`الفئة: ${CATEGORY_LABELS[request.category] ?? request.category ?? "—"}`)
      );
      tags.appendChild(makeTag(`المدينة: ${request.city ?? "—"}`));
      tags.appendChild(
        makeTag(
          `الميزانية: ${request.max_price != null ? `${formatThousands(request.max_price)} ${request.currency ?? "د.ع"}` : "—"}`
        )
      );
      tags.appendChild(makeTag(`الحالة: ${STATUS_LABELS[request.status] ?? request.status ?? "—"}`));
      tags.appendChild(makeTag(`التاريخ: ${request.created_at ?? "—"}`));
      card.appendChild(tags);

      if (request.description) {
        const description = document.createElement("p");
        description.textContent = request.description;
        card.appendChild(description);
      }

      const actions = document.createElement("div");
      actions.style.display = "flex";
      actions.style.gap = "8px";
      actions.style.marginTop = "12px";
      actions.style.alignItems = "center";

      const statusSelect = document.createElement("select");
      for (const [value, label] of Object.entries(STATUS_LABELS)) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = label;
        if (value === request.status) option.selected = true;
        statusSelect.appendChild(option);
      }

      const saveStatusBtn = document.createElement("button");
      saveStatusBtn.type = "button";
      saveStatusBtn.className = "btn btn-primary";
      saveStatusBtn.textContent = "حفظ الحالة";
      saveStatusBtn.addEventListener("click", async () => {
        saveStatusBtn.disabled = true;
        try {
          await updateRequest(request.id, { status: statusSelect.value });
        } catch (err) {
          console.error(err);
          showPageError("تعذّر تحديث حالة الطلب");
        } finally {
          saveStatusBtn.disabled = false;
        }
      });

      const deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.className = "btn btn-ghost";
      deleteBtn.textContent = "حذف الطلب";
      deleteBtn.addEventListener("click", async () => {
        if (!window.confirm("هل أنت متأكد من حذف هذا الطلب؟")) return;
        deleteBtn.disabled = true;
        try {
          await deleteRequest(request.id);
          card.remove();
          if (list.children.length === 0) emptyMsg.hidden = false;
        } catch (err) {
          console.error(err);
          showPageError("تعذّر حذف الطلب");
          deleteBtn.disabled = false;
        }
      });

      actions.append(statusSelect, saveStatusBtn, deleteBtn);
      card.appendChild(actions);

      return card;
    }

    let requests;
    try {
      const { data, error } = await supabase
        .from("property_requests")
        .select("*, users!property_requests_buyer_id_fkey(full_name, email)")
        .order("created_at", { ascending: false });
      if (error) throw error;
      requests = data;
    } catch (err) {
      console.error(err);
      showPageError("تعذّر تحميل الطلبات");
    } finally {
      loadingMsg.hidden = true;
    }

    if (!requests || requests.length === 0) {
      emptyMsg.hidden = false;
    } else {
      for (const request of requests) {
        list.appendChild(renderCard(request));
      }
    }
  </script>
</body>
</html>
