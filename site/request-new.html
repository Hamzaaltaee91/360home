<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلب جديد — دبّرلي</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="site-nav">
    <div class="container">
      <a href="index.html" class="brand">دبّرلي</a>
      <ul class="nav-links">
        <li><a href="dashboard.html">طلباتي</a></li>
      </ul>
      <div class="nav-actions">
        <button id="signout-btn" class="btn btn-ghost">تسجيل الخروج</button>
        <a href="request-new.html" class="btn btn-primary">+ طلب جديد</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="page-head">
      <div>
        <h1>طلب جديد</h1>
        <p>حدد مواصفاتك وخلّي العروض تجيك.</p>
      </div>
    </div>

    <form id="request-form" class="card">
      <fieldset>
        <legend>الفئة والغرض</legend>
        <div class="form-grid">
          <div class="form-field">
            <label for="category">الفئة</label>
            <select id="category" required>
              <option value="residential">سكني</option>
              <option value="commercial">تجاري</option>
              <option value="land">أرض</option>
            </select>
          </div>
          <div class="form-field">
            <label for="purpose">الغرض</label>
            <select id="purpose" required>
              <option value="" disabled selected>— اختر الغرض —</option>
              <option value="rent">إيجار</option>
              <option value="buy">شراء</option>
            </select>
          </div>
          <div class="form-field">
            <label for="title">عنوان الطلب</label>
            <input type="text" id="title" required>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>الموقع</legend>
        <div class="form-grid">
          <div class="form-field">
            <label for="city">المحافظة</label>
            <select id="city" required>
              <option value="" disabled selected>— اختر المحافظة —</option>
            </select>
          </div>
          <div class="form-field">
            <label for="area-name">المنطقة</label>
            <select id="area-name">
              <option value="" disabled selected>— اختر المحافظة أولاً —</option>
            </select>
          </div>
          <div class="form-field" id="area-other-field" hidden>
            <label for="area-other">اسم المنطقة</label>
            <input type="text" id="area-other">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>الميزانية</legend>
        <div class="form-grid">
          <div class="form-field">
            <label for="max-price">سقف الميزانية</label>
            <input type="number" id="max-price">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>المواصفات</legend>
        <div class="form-grid">
          <div class="form-field">
            <label for="bedrooms">عدد غرف النوم</label>
            <input type="number" id="bedrooms">
          </div>
          <div class="form-field">
            <label for="bathrooms">عدد الحمامات</label>
            <input type="number" id="bathrooms">
          </div>
          <div class="form-field">
            <label><input type="checkbox" id="furnished"> مفروش</label>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>تفاصيل إضافية</legend>
        <div class="form-grid">
          <div class="form-field is-full">
            <label for="description">الوصف</label>
            <textarea id="description"></textarea>
          </div>
        </div>
      </fieldset>
      <p class="error-text" id="error" hidden></p>
      <button type="submit" class="btn btn-primary btn-lg">انشر الطلب</button>
    </form>
  </div>

  <script type="module">
    import { requireSession, signOut } from "./js/auth.js";
    import { createRequest } from "./js/requests.js";
    import iraqLocations from "./js/iraq-locations.js";

    await requireSession();
    document.getElementById("signout-btn").addEventListener("click", signOut);

    const citySelect = document.getElementById("city");
    const areaSelect = document.getElementById("area-name");
    const areaOtherField = document.getElementById("area-other-field");
    const areaOtherInput = document.getElementById("area-other");

    Object.entries(iraqLocations).forEach(([key, gov]) => {
      const option = document.createElement("option");
      option.value = key;            // المفتاح (slug) كقيمة
      option.textContent = gov.label; // الاسم العربي كنص
      citySelect.appendChild(option);
    });

    function populateAreas(govKey) {
      areaSelect.innerHTML = "";
      areaOtherField.hidden = true;
      areaOtherInput.value = "";

      const gov = iraqLocations[govKey];
      if (!gov) {
        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.disabled = true;
        placeholder.selected = true;
        placeholder.textContent = "— اختر المحافظة أولاً —";
        areaSelect.appendChild(placeholder);
        return;
      }

      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.disabled = true;
      placeholder.selected = true;
      placeholder.textContent = "— اختر المنطقة —";
      areaSelect.appendChild(placeholder);

      gov.areas.forEach((area) => {
        const option = document.createElement("option");
        option.value = area.value;     // 'other' واحدة منها
        option.textContent = area.label;
        areaSelect.appendChild(option);
      });
    }

    citySelect.addEventListener("change", () => populateAreas(citySelect.value));

    areaSelect.addEventListener("change", () => {
      const isOther = areaSelect.value === "other";
      areaOtherField.hidden = !isOther;
      if (!isOther) {
        areaOtherInput.value = "";
      }
    });

    document.getElementById("request-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("error");
      errorEl.hidden = true;

      if (!document.getElementById("purpose").value) {
        document.getElementById("error").textContent =
          "الرجاء اختيار الغرض (إيجار أو شراء).";
        document.getElementById("error").hidden = false;
        return;
      }

      const val = (id) => document.getElementById(id).value;
      const num = (id) => (val(id) === "" ? null : Number(val(id)));
      const budget = num("max-price");

      // نحوّل مفاتيح الـselect إلى الأسماء العربية (كما كان السلوك السابق مع النص الحر).
      const gov = iraqLocations[val("city")];
      const areaName = areaSelect.value === "other"
        ? (val("area-other") || null)
        : areaSelect.value
          ? (gov?.areas.find((a) => a.value === areaSelect.value)?.label ?? null)
          : null;

      try {
        await createRequest({
          category: val("category"),
          title: val("title"),
          description: val("description") || null,
          city: gov ? gov.label : null,
          area_name: areaName,
          min_price:
            budget === null ? null : Math.round(budget * 0.7),
          max_price: budget,
          bedrooms: num("bedrooms"),
          bathrooms: num("bathrooms"),
          furnished: document.getElementById("furnished").checked,
        });
        window.location.href = "dashboard.html";
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.hidden = false;
      }
    });
  </script>
</body>
</html>
