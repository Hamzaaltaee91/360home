<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — دبّرلي</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <a href="index.html" class="auth-back">→ رجوع للرئيسية</a>

    <div class="card auth-card">
      <h2 class="auth-heading"><span id="form-title">تسجيل الدخول</span></h2>

      <button type="button" class="btn btn-google" id="google-btn">
        <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
          <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
          <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
          <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
        </svg>
        <span>المتابعة عبر Google</span>
      </button>

      <p class="divider-text">أو سجّل بالبريد الإلكتروني</p>

      <form id="auth-form">
        <div class="form-field">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-field" id="name-field" hidden>
          <label for="full-name">الاسم الكامل</label>
          <input type="text" id="full-name">
        </div>
        <div class="form-field">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" required minlength="6">
        </div>
        <p class="error-text" id="error" hidden></p>
        <button type="submit" class="btn btn-primary" id="submit-btn">دخول</button>
      </form>

      <p class="auth-toggle"><a href="#" id="toggle-mode">ليس لديك حساب؟ أنشئ حسابًا جديدًا</a></p>
    </div>
  </div>

  <script type="module">
    import { signUpBuyer, signIn, signInWithGoogle } from "./js/auth.js";
    import { supabase } from "./js/supabase-client.js";

    let mode = new URLSearchParams(window.location.search).get("mode") === "signup" ? "signup" : "signin";
    const form = document.getElementById("auth-form");
    const nameField = document.getElementById("name-field");
    const formTitle = document.getElementById("form-title");
    const submitBtn = document.getElementById("submit-btn");
    const toggle = document.getElementById("toggle-mode");
    const errorEl = document.getElementById("error");

    function applyMode() {
      nameField.hidden = mode === "signin";
      formTitle.textContent = mode === "signin" ? "تسجيل الدخول" : "إنشاء حساب";
      submitBtn.textContent = mode === "signin" ? "دخول" : "إنشاء حساب";
      toggle.textContent = mode === "signin"
        ? "ليس لديك حساب؟ أنشئ حسابًا جديدًا"
        : "لديك حساب بالفعل؟ سجّل الدخول";
    }
    applyMode();

    supabase.auth.getSession().then(({ data }) => {
      if (data.session) window.location.href = "dashboard.html";
    });

    toggle.addEventListener("click", (e) => {
      e.preventDefault();
      mode = mode === "signin" ? "signup" : "signin";
      applyMode();
      errorEl.hidden = true;
    });

    document.getElementById("google-btn").addEventListener("click", async () => {
      errorEl.hidden = true;
      const { error } = await signInWithGoogle();
      if (error) {
        errorEl.textContent = error.message;
        errorEl.hidden = false;
      }
      // على النجاح، Google/Supabase يعيدون توجيه المتصفح تلقائياً — لا حاجة لأي تحويل يدوي هنا.
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.hidden = true;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const fullName = document.getElementById("full-name").value;

      const { error } =
        mode === "signin"
          ? await signIn(email, password)
          : await signUpBuyer(email, password, fullName);

      if (error) {
        errorEl.textContent = error.message;
        errorEl.hidden = false;
        return;
      }
      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
