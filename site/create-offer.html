<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تقديم عرض — دبّرلي</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="site-nav">
    <div class="container">
      <a href="index.html" class="brand">دبّرلي</a>
      <ul class="nav-links">
        <li><a href="my-offers.html">عروضي</a></li>
        <li><a href="realtor-requests.html">تصفح الطلبات</a></li>
        <li><a href="notifications.html">الإشعارات</a></li>
      </ul>
      <div class="nav-actions">
        <button id="signout-btn" class="btn btn-ghost">تسجيل الخروج</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="page-head">
      <div>
        <h1>تقديم عرض</h1>
        <p>قدّم عرضك على طلب العقار.</p>
      </div>
    </div>

    <p class="error-text" id="page-error" hidden></p>

    <form id="offer-form" class="card">
      <fieldset>
        <legend>تفاصيل العقار</legend>
        <div class="form-grid">
          <div class="form-field is-full">
            <label for="property-title">عنوان العقار</label>
            <input type="text" id="property-title" required>
            <span class="error-text" data-error-for="property-title" hidden></span>
          </div>
          <div class="form-field is-full">
            <label for="property-description">وصف العقار</label>
            <textarea id="property-description"></textarea>
          </div>
          <div class="form-field is-full">
            <label for="property-address">عنوان الموقع</label>
            <input type="text" id="property-address" required>
            <span class="error-text" data-error-for="property-address" hidden></span>
          </div>
          <div class="form-field is-full">
            <label for="property-photos">صور العقار</label>
            <input type="file" id="property-photos" multiple accept="image/*">
            <span class="error-text" data-error-for="property-photos" hidden></span>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>السعر ونوع العرض</legend>
        <div class="form-grid">
          <div class="form-field">
            <label for="offered-price">السعر المعروض (دينار عراقي — الرقم الكامل)</label>
            <input type="text" inputmode="numeric" id="offered-price" required>
            <span class="error-text" data-error-for="offered-price" hidden></span>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>المواصفات</legend>
        <div class="form-grid">
          <div class="form-field">
            <label for="area-sqft">مساحة العقار (قدم مربع)</label>
            <input type="text" inputmode="numeric" id="area-sqft">
            <span class="error-text" data-error-for="area-sqft" hidden></span>
          </div>
          <div class="form-field">
            <label for="bedrooms">عدد الغرف</label>
            <select id="bedrooms">
              <option value="" disabled selected>— اختر —</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
            <span class="error-text" data-error-for="bedrooms" hidden></span>
          </div>
          <div class="form-field">
            <label for="bathrooms">عدد الحمامات</label>
            <select id="bathrooms">
              <option value="" disabled selected>— اختر —</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
            <span class="error-text" data-error-for="bathrooms" hidden></span>
          </div>
          <div class="form-field">
            <label><input type="checkbox" id="furnished"> مفروش</label>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>تفاصيل إضافية</legend>
        <div class="form-grid">
          <div class="form-field is-full">
            <label for="message-to-buyer">رسالة للمشتري</label>
            <textarea id="message-to-buyer"></textarea>
          </div>
        </div>
      </fieldset>

      <p class="error-text" id="form-error" hidden></p>
      <button type="submit" class="btn btn-primary btn-lg">أرسل العرض</button>
    </form>
  </div>

  <script type="module">
    import { requireSession, signOut } from "./js/auth.js";
    import { createOffer, uploadOfferPhotos } from "./js/offers.js";
    import { toWesternDigits, formatThousands, stripThousands } from "./js/numerals.js";

    const pageErrorEl = document.getElementById("page-error");
    const offerForm = document.getElementById("offer-form");

    const requestId = new URLSearchParams(window.location.search).get("request_id");

    if (!requestId) {
      pageErrorEl.textContent = "تعذّر تحميل النموذج: رقم الطلب (request_id) مفقود من الرابط.";
      pageErrorEl.hidden = false;
      offerForm.hidden = true;
    } else {
      await requireSession();
      document.getElementById("signout-btn").addEventListener("click", signOut);

      // تحويل الأرقام العربية-الهندية (٠-٩) إلى غربية (0-9) لحظياً أثناء الكتابة،
      // بنفس نمط site/request-new.html (أرقام غربية فقط بلا فواصل آلاف أو رموز).
      function sanitizeNumericInput(input, digitsOnly, format) {
        const converted = toWesternDigits(input.value);
        const sanitized = digitsOnly ? converted.replace(/\D/g, "") : converted;
        const newValue = format ? formatThousands(sanitized) : sanitized;
        if (newValue === input.value) {
          return;
        }
        const caret = input.selectionStart;
        input.value = newValue;
        if (caret !== null) {
          input.setSelectionRange(caret, Math.min(caret, newValue.length));
        }
      }

      const numericInputs = [
        { id: "offered-price", digitsOnly: true, format: true },
        { id: "area-sqft", digitsOnly: true },
      ];

      numericInputs.forEach(({ id, digitsOnly, format }) => {
        const input = document.getElementById(id);
        input.addEventListener("input", () => sanitizeNumericInput(input, digitsOnly, format));
      });

      const formErrorEl = document.getElementById("form-error");

      function clearFieldErrors() {
        formErrorEl.hidden = true;
        formErrorEl.textContent = "";
        document.querySelectorAll("[data-error-for]").forEach((el) => {
          el.hidden = true;
          el.textContent = "";
        });
      }

      function showFieldError(fieldId, message) {
        const el = document.querySelector(`[data-error-for="${fieldId}"]`);
        if (el) {
          el.textContent = message;
          el.hidden = false;
        }
      }

      offerForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        clearFieldErrors();

        let hasError = false;

        if (!document.getElementById("property-title").value.trim()) {
          showFieldError("property-title", "الرجاء إدخال عنوان العقار.");
          hasError = true;
        }

        if (!document.getElementById("property-address").value.trim()) {
          showFieldError("property-address", "الرجاء إدخال عنوان الموقع.");
          hasError = true;
        }

        if (!document.getElementById("offered-price").value.trim()) {
          showFieldError("offered-price", "الرجاء إدخال السعر المعروض.");
          hasError = true;
        }

        if (!document.getElementById("area-sqft").value.trim()) {
          showFieldError("area-sqft", "الرجاء إدخال مساحة العقار.");
          hasError = true;
        }

        if (!document.getElementById("bedrooms").value) {
          showFieldError("bedrooms", "الرجاء اختيار عدد الغرف.");
          hasError = true;
        }

        if (!document.getElementById("bathrooms").value) {
          showFieldError("bathrooms", "الرجاء اختيار عدد الحمامات.");
          hasError = true;
        }

        if (document.getElementById("property-photos").files.length === 0) {
          showFieldError("property-photos", "الرجاء اختيار صورة واحدة على الأقل.");
          hasError = true;
        }

        if (hasError) {
          return;
        }

        const val = (id) => document.getElementById(id).value;
        const numOrNull = (id) => (val(id) === "" ? null : Number(val(id)));

        try {
          const offer = await createOffer({
            request_id: requestId,
            property_title: val("property-title").trim(),
            property_description: val("property-description") || null,
            property_address: val("property-address").trim(),
            offered_price: Number(stripThousands(val("offered-price"))),
            area_sqft: numOrNull("area-sqft"),
            bedrooms: numOrNull("bedrooms"),
            bathrooms: numOrNull("bathrooms"),
            furnished: document.getElementById("furnished").checked,
            message_to_buyer: val("message-to-buyer") || null,
          });

          const files = Array.from(
            document.getElementById("property-photos").files
          );
          if (files.length > 0) {
            await uploadOfferPhotos(offer.id, files);
          }

          window.location.href = "my-offers.html";
        } catch (err) {
          formErrorEl.textContent = err.message;
          formErrorEl.hidden = false;
        }
      });
    }
  </script>
</body>
</html>
