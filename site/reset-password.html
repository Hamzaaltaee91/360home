<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تعيين كلمة مرور جديدة — دبّرلي</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="auth-back">← رجوع للرئيسية</a>

    <h2 class="auth-heading">تعيين كلمة مرور جديدة</h2>

    <p id="invalid-link-msg" hidden>رابط إعادة التعيين غير صالح أو منتهي الصلاحية. اطلب رابطاً جديداً من صفحة تسجيل الدخول.</p>

    <form id="reset-form">
      <div class="form-field">
        <label for="new-password">كلمة المرور الجديدة</label>
        <input type="password" id="new-password" required minlength="6">
      </div>
      <p class="error-text" id="error" hidden></p>
      <p id="success-msg" hidden>تم تحديث كلمة المرور بنجاح.</p>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">تحديث كلمة المرور</button>
    </form>
  </div>

  <script type="module">
    import { updatePassword } from "./js/auth.js";
    import { supabase } from "./js/supabase-client.js";

    const form = document.getElementById("reset-form");
    const errorEl = document.getElementById("error");
    const successEl = document.getElementById("success-msg");
    const submitBtn = document.getElementById("submit-btn");
    const invalidMsg = document.getElementById("invalid-link-msg");

    const { data } = await supabase.auth.getSession();
    if (!data.session) {
      form.hidden = true;
      invalidMsg.hidden = false;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.hidden = true;
      submitBtn.disabled = true;
      const newPassword = document.getElementById("new-password").value;

      const { error } = await updatePassword(newPassword);
      if (error) {
        errorEl.textContent = error.message;
        errorEl.hidden = false;
        submitBtn.disabled = false;
        return;
      }
      successEl.hidden = false;
      form.querySelector("button").textContent = "تم";
      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 1500);
    });
  </script>
</body>
</html>
