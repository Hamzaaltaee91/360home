<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلباتي — دبّرلي</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="site-nav">
    <div class="container">
      <a href="index.html" class="brand">دبّرلي</a>
      <ul class="nav-links">
        <li><a href="dashboard.html">طلباتي</a></li>
        <li><a href="notifications.html" id="notifications-link">الإشعارات</a></li>
        <li><a href="become-realtor.html">سجل كوسيط</a></li>
      </ul>
      <div class="nav-actions">
        <div id="profile-menu-slot"></div>
        <a href="request-new.html" class="btn btn-primary">+ طلب جديد</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>طلباتي</h1>
        <p>كل طلب نشرته، والعروض اللي وصلته.</p>
      </div>
    </div>

    <p id="loading-msg">جاري التحميل...</p>

    <div class="request-list" id="requests-list"></div>

    <div class="empty-state" hidden id="empty-msg">
      <h3>لا توجد طلبات بعد</h3>
      <p>انشر طلبك الأول وخلّي العروض تجيك.</p>
      <a href="request-new.html" class="btn btn-primary">+ طلب جديد</a>
    </div>
  </main>

  <!-- ===== الفوتر ===== -->
  <footer class="site-footer">
    <div class="container footer-grid">
      <a href="index.html" class="brand">دبّرلي</a>
      <ul class="footer-links">
        <li><a href="dashboard.html">طلباتي</a></li>
        <li><a href="request-new.html">طلب جديد</a></li>
        <li><a href="contact.html">اتصل بنا</a></li>
      </ul>
      <span>© ٢٠٢٦ دبّرلي</span>
    </div>
  </footer>

  <script type="module">
    import { requireSession, mountProfileMenu } from "./js/auth.js";
    import { listMyRequests } from "./js/requests.js";
    import { subscribeToUnreadCount } from "./js/notifications.js";
    import { formatThousands } from "./js/numerals.js";

    const CATEGORY_LABELS = {
      residential: "سكني",
      commercial: "تجاري",
      land: "أرض",
    };

    await requireSession();
    await mountProfileMenu(document.getElementById("profile-menu-slot"));

    const loadingMsg = document.getElementById("loading-msg");
    let requests;
    try {
      requests = await listMyRequests();
    } finally {
      loadingMsg.hidden = true;
    }
    const list = document.getElementById("requests-list");
    if (requests.length === 0) {
      document.getElementById("empty-msg").hidden = false;
    }
    for (const r of requests) {
      const a = document.createElement("a");
      a.href = `request.html?id=${encodeURIComponent(r.id)}`;
      a.style.textDecoration = "none";
      a.style.color = "inherit";

      const card = document.createElement("article");
      card.className = "card request-item";

      const h3 = document.createElement("h3");
      h3.textContent = r.title;

      const tags = document.createElement("ul");
      tags.className = "request-tags";

      const catTag = document.createElement("li");
      catTag.className = "tag tag-active";
      catTag.textContent = CATEGORY_LABELS[r.category] || r.category;

      const cityTag = document.createElement("li");
      cityTag.className = "tag";
      cityTag.textContent = r.city;

      const governorateTag = document.createElement("li");
      governorateTag.className = "tag";
      governorateTag.textContent = r.governorate || "—";

      const purposeTag = document.createElement("li");
      purposeTag.className = "tag";
      purposeTag.textContent = r.purpose === "rent" ? "إيجار" : "شراء";

      const budgetTag = document.createElement("li");
      budgetTag.className = "tag";
      budgetTag.textContent =
        r.max_price != null ? `${formatThousands(r.max_price)} د.ع` : "—";

      tags.append(catTag, cityTag, governorateTag, purposeTag, budgetTag);

      card.append(h3, tags);
      a.appendChild(card);
      list.appendChild(a);
    }

    try {
      await subscribeToUnreadCount((count) => {
        const link = document.getElementById("notifications-link");
        if (!link) return;
        link.textContent =
          count > 0 ? `الإشعارات (${count})` : "الإشعارات";
      });
    } catch (err) {
      console.error(err);
    }
  </script>
</body>
</html>
