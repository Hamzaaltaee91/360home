<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلباتي — دبّرلي</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="site-nav">
    <div class="container">
      <a href="index.html" class="brand">دبّرلي</a>
      <ul class="nav-links">
        <li><a href="dashboard.html">طلباتي</a></li>
      </ul>
      <div class="nav-actions">
        <button id="signout-btn" class="btn btn-ghost">تسجيل الخروج</button>
        <a href="request-new.html" class="btn btn-primary">+ طلب جديد</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>طلباتي</h1>
        <p>كل طلب نشرته، والعروض اللي وصلته.</p>
      </div>
    </div>

    <div class="request-list" id="requests-list"></div>

    <div class="empty-state" hidden id="empty-msg">
      <h3>لا توجد طلبات بعد</h3>
      <p>انشر طلبك الأول وخلّي العروض تجيك.</p>
      <a href="request-new.html" class="btn btn-primary">+ طلب جديد</a>
    </div>
  </main>

  <script type="module">
    import { requireSession, signOut } from "./js/auth.js";
    import { listMyRequests } from "./js/requests.js";

    await requireSession();
    document.getElementById("signout-btn").addEventListener("click", signOut);

    const requests = await listMyRequests();
    const list = document.getElementById("requests-list");
    if (requests.length === 0) {
      document.getElementById("empty-msg").hidden = false;
    }
    for (const r of requests) {
      const a = document.createElement("a");
      a.href = `request.html?id=${encodeURIComponent(r.id)}`;
      a.style.textDecoration = "none";
      a.style.color = "inherit";

      const card = document.createElement("article");
      card.className = "card request-item";

      const h3 = document.createElement("h3");
      h3.textContent = r.title;

      const tags = document.createElement("ul");
      tags.className = "request-tags";
      tags.innerHTML = `
        <li class="tag tag-active">${r.category}</li>
        <li class="tag">${r.city}</li>
      `;

      card.append(h3, tags);
      a.appendChild(card);
      list.appendChild(a);
    }
  </script>
</body>
</html>
