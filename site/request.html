<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل الطلب — دبّرلي</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <a href="dashboard.html" class="btn">→ رجوع</a>
    <div id="request-detail"></div>
    <h2>العروض</h2>
    <div id="offers-list"></div>
    <p id="empty-msg" hidden>لا توجد عروض بعد على هذا الطلب.</p>
  </div>

  <script type="module">
    import { requireSession } from "./js/auth.js";
    import { getRequest } from "./js/requests.js";
    import { listOffersForRequest } from "./js/offers.js";

    await requireSession();

    const requestId = new URLSearchParams(window.location.search).get("id");
    const request = await getRequest(requestId);

    {
      const detail = document.getElementById("request-detail");
      const card = document.createElement("div");
      card.className = "card";

      const h1 = document.createElement("h1");
      h1.textContent = request.title;

      const pCity = document.createElement("p");
      pCity.textContent = `${request.city} — ${request.category}`;

      const pDesc = document.createElement("p");
      pDesc.textContent = request.description ?? "";

      card.append(h1, pCity, pDesc);
      detail.appendChild(card);
    }

    const offers = await listOffersForRequest(requestId);
    const list = document.getElementById("offers-list");
    if (offers.length === 0) {
      document.getElementById("empty-msg").hidden = false;
    }
    for (const o of offers) {
      const a = document.createElement("a");
      a.href = `offer.html?id=${encodeURIComponent(o.id)}`;
      a.style.textDecoration = "none";
      a.style.color = "inherit";

      const card = document.createElement("div");
      card.className = "card";

      const h3 = document.createElement("h3");
      h3.textContent = o.property_title;

      const p = document.createElement("p");
      p.textContent = `${o.offered_price} ${o.currency}`;

      card.append(h3, p);
      a.appendChild(card);
      list.appendChild(a);
    }
  </script>
</body>
</html>
