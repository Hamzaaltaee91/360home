<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل الطلب — دبّرلي</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="site-nav">
    <div class="container">
      <a href="index.html" class="brand">دبّرلي</a>
      <ul class="nav-links">
        <li><a href="dashboard.html">طلباتي</a></li>
      </ul>
      <div class="nav-actions">
        <button id="signout-btn" class="btn btn-ghost">تسجيل الخروج</button>
        <a href="request-new.html" class="btn btn-primary">+ طلب جديد</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <a href="dashboard.html" class="btn btn-ghost">→ رجوع لطلباتي</a>

    <div id="request-detail"></div>

    <div class="page-head">
      <div>
        <h1>العروض</h1>
        <p>العروض اللي وصلت على هذا الطلب.</p>
      </div>
    </div>

    <div class="request-list" id="offers-list"></div>

    <div class="empty-state" hidden id="empty-msg">
      <h3>لا توجد عروض بعد</h3>
      <p>لسه ما وصل عرض على هذا الطلب. راجعنا بعدين.</p>
    </div>
  </main>

  <script type="module">
    import { requireSession, signOut } from "./js/auth.js";
    import { getRequest } from "./js/requests.js";
    import { listOffersForRequest } from "./js/offers.js";

    await requireSession();
    document.getElementById("signout-btn").addEventListener("click", signOut);

    const requestId = new URLSearchParams(window.location.search).get("id");
    const request = await getRequest(requestId);

    {
      const detail = document.getElementById("request-detail");
      const card = document.createElement("div");
      card.className = "card";

      const h1 = document.createElement("h1");
      h1.textContent = request.title;

      const tags = document.createElement("ul");
      tags.className = "request-tags";

      const catTag = document.createElement("li");
      catTag.className = "tag tag-active";
      catTag.textContent = request.category;

      const cityTag = document.createElement("li");
      cityTag.className = "tag";
      cityTag.textContent = request.city;

      const purposeTag = document.createElement("li");
      purposeTag.className = "tag";
      purposeTag.textContent = request.purpose;

      const govTag = document.createElement("li");
      govTag.className = "tag";
      govTag.textContent = request.governorate;

      const areaTag = document.createElement("li");
      areaTag.className = "tag";
      areaTag.textContent = request.area;

      const subtypeTag = document.createElement("li");
      subtypeTag.className = "tag";
      subtypeTag.textContent = request.property_subtype;

      tags.append(catTag, cityTag, purposeTag, govTag, areaTag, subtypeTag);

      if (request.rental_period != null) {
        const rentalTag = document.createElement("li");
        rentalTag.className = "tag";
        rentalTag.textContent = request.rental_period;
        tags.appendChild(rentalTag);
      }

      const pDesc = document.createElement("p");
      pDesc.textContent = request.description ?? "";

      card.append(h1, tags, pDesc);
      detail.appendChild(card);
    }

    const offers = await listOffersForRequest(requestId);
    const list = document.getElementById("offers-list");
    if (offers.length === 0) {
      document.getElementById("empty-msg").hidden = false;
    }
    for (const o of offers) {
      const a = document.createElement("a");
      a.href = `offer.html?id=${encodeURIComponent(o.id)}`;
      a.style.textDecoration = "none";
      a.style.color = "inherit";

      const card = document.createElement("article");
      card.className = "card request-item";

      const h3 = document.createElement("h3");
      h3.textContent = o.property_title;

      const p = document.createElement("p");
      p.textContent = `${o.offered_price} ${o.currency}`;

      card.append(h3, p);
      a.appendChild(card);
      list.appendChild(a);
    }
  </script>
</body>
</html>
