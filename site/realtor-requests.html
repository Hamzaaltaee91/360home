<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الطلبات المتاحة — دبّرلي</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="site-nav">
    <div class="container">
      <a href="index.html" class="brand">دبّرلي</a>
      <ul class="nav-links">
        <li><a href="realtor-requests.html">الطلبات المتاحة</a></li>
        <li><a href="my-offers.html">عروضي</a></li>
        <li><a href="notifications.html">الإشعارات</a></li>
      </ul>
      <div class="nav-actions">
        <button id="signout-btn" class="btn btn-ghost">تسجيل الخروج</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>الطلبات المتاحة</h1>
        <p>تصفّح طلبات المشترين النشطة وقدّم عرضك.</p>
      </div>
    </div>

    <div class="filters">
      <label>
        الفئة
        <select id="filter-category">
          <option value="">الكل</option>
          <option value="residential">سكني</option>
          <option value="commercial">تجاري</option>
          <option value="land">أرض</option>
        </select>
      </label>

      <label>
        المحافظة
        <select id="filter-city">
          <option value="">الكل</option>
        </select>
      </label>

      <label>
        الحد الأقصى للميزانية
        <input type="number" id="filter-max-price" min="0" step="any">
      </label>
    </div>

    <p id="loading-msg">جاري التحميل...</p>
    <div class="request-list" id="requests-list"></div>

    <div class="empty-state" hidden id="empty-msg">
      <h3>لا توجد طلبات نشطة حالياً</h3>
      <p>ارجع لاحقاً — الطلبات الجديدة تظهر هنا فوراً.</p>
    </div>
  </main>

  <!-- ===== الفوتر ===== -->
  <footer class="site-footer">
    <div class="container footer-grid">
      <a href="index.html" class="brand">دبّرلي</a>
      <ul class="footer-links">
        <li><a href="realtor-requests.html">الطلبات المتاحة</a></li>
        <li><a href="contact.html">اتصل بنا</a></li>
      </ul>
      <span>© ٢٠٢٦ دبّرلي</span>
    </div>
  </footer>

  <script type="module">
    import { requireSession, signOut } from "./js/auth.js";
    import { listActiveRequestsForRealtor } from "./js/requests.js";
    import iraqLocations from "./js/iraq-locations.js";

    await requireSession();
    document.getElementById("signout-btn").addEventListener("click", signOut);

    const citySelect = document.getElementById("filter-city");
    for (const [value, governorate] of Object.entries(iraqLocations)) {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = governorate.label;
      citySelect.appendChild(option);
    }

    const loadingMsg = document.getElementById("loading-msg");

    let allRequests;
    try {
      allRequests = await listActiveRequestsForRealtor();
    } finally {
      loadingMsg.hidden = true;
    }
    const list = document.getElementById("requests-list");
    const emptyMsg = document.getElementById("empty-msg");
    const categorySelect = document.getElementById("filter-category");
    const maxPriceInput = document.getElementById("filter-max-price");

    function renderRequests() {
      const category = categorySelect.value;
      const city = citySelect.value;
      const cityLabel = city === "" ? "" : iraqLocations[city].label;

      const budgetText = maxPriceInput.value.trim();
      const budget = budgetText === "" ? null : Number(budgetText);

      const visible = allRequests.filter((r) => {
        if (category !== "" && r.category !== category) return false;
        if (city !== "" && r.city !== city && r.city !== cityLabel) return false;
        if (
          budget !== null &&
          Number.isFinite(budget) &&
          r.max_price != null &&
          Number(r.max_price) > budget
        ) {
          return false;
        }
        return true;
      });

      list.replaceChildren();

      for (const r of visible) {
      const card = document.createElement("article");
      card.className = "card request-item";

      const h3 = document.createElement("h3");
      h3.textContent = r.title;

      const tags = document.createElement("ul");
      tags.className = "request-tags";

      const catTag = document.createElement("li");
      catTag.className = "tag tag-active";
      catTag.textContent = r.category;

      const cityTag = document.createElement("li");
      cityTag.className = "tag";
      cityTag.textContent = r.city;

      const purposeTag = document.createElement("li");
      purposeTag.className = "tag";
      purposeTag.textContent = r.purpose === "rent" ? "إيجار" : "شراء";

      const budgetTag = document.createElement("li");
      budgetTag.className = "tag";
      budgetTag.textContent = r.max_price != null ? `${r.max_price}` : "—";

      tags.append(catTag, cityTag, purposeTag, budgetTag);

      const offerLink = document.createElement("a");
      offerLink.href = `create-offer.html?request_id=${encodeURIComponent(r.id)}`;
      offerLink.className = "btn btn-primary";
      offerLink.textContent = "قدم عرض";

      card.append(h3, tags, offerLink);
      list.appendChild(card);
      }

      emptyMsg.hidden = visible.length > 0;
    }

    categorySelect.addEventListener("change", renderRequests);
    citySelect.addEventListener("change", renderRequests);
    maxPriceInput.addEventListener("input", renderRequests);

    renderRequests();
  </script>
</body>
</html>
